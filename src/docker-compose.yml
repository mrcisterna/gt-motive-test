version: '3.8'

services:
  microservice:
    build:
      context: ..
      dockerfile: src/GtMotive.Estimate.Microservice.Host/Dockerfile
    image: vehicle-rental-microservice:latest
    container_name: vehicle-rental-microservice
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    restart: unless-stopped
    networks:
      - vehicle-rental-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  vehicle-rental-network:
    driver: bridge